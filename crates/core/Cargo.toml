[package]
name = "dictation-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "dictation_core"

[dependencies]
regex = "1.13.1"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
ulid = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
thiserror = "2"
transcribe-rs = { version = "0.3.12", optional = true, default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12.0"

[features]
parakeet = ["transcribe-rs/onnx", "transcribe-rs/vad-silero"]
whisper = ["transcribe-rs/whisper-cpp"]
whisper-metal = ["whisper", "transcribe-rs/whisper-metal"]
whisper-vulkan = ["whisper", "transcribe-rs/whisper-vulkan"]
