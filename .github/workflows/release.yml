name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p dictation-core
  release:
    needs: core
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            bundle: dmg
            args: --target aarch64-apple-darwin --bundles dmg
          - os: windows-latest
            bundle: nsis
            args: --bundles nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI install and build
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Short target dir (MAX_PATH in nested CMake builds)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "CARGO_TARGET_DIR=D:/t" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Vulkan SDK
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.309.0
          cache: true
      - name: Cache cargo-tauri
        id: tauri-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri*
          key: cargo-tauri-2-${{ runner.os }}
          save-always: true
      - name: Install tauri-cli
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked
      # Signing, in order of preference:
      # 1. MACOS_SIGNING_P12: our own self-signed certificate. A stable identity
      #    keeps macOS permissions (Accessibility, Input Monitoring) across updates.
      #    Imported into a temp keychain; Tauri signs by its SHA-1 fingerprint.
      # 2. APPLE_CERTIFICATE: an Apple Developer ID certificate (Tauri imports it).
      #    Tauri treats any set APPLE_CERTIFICATE (even empty) as present, so
      #    secrets are only exported when they exist.
      # 3. Neither: ad-hoc signing.
      - name: macOS signing setup
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "$MACOS_SIGNING_P12" ]; then
            echo "Signing with the self-signed Dictation certificate"
            KC="$RUNNER_TEMP/dictation-signing.keychain-db"
            KC_PW="$(openssl rand -hex 16)"
            echo "$MACOS_SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
            security create-keychain -p "$KC_PW" "$KC"
            security set-keychain-settings -t 3600 -u "$KC"
            security unlock-keychain -p "$KC_PW" "$KC"
            security import "$RUNNER_TEMP/signing.p12" -k "$KC" -P "$MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" >/dev/null
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
            rm -f "$RUNNER_TEMP/signing.p12"
            security find-identity "$KC"
            echo "APPLE_SIGNING_IDENTITY=$MACOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          elif [ -n "$APPLE_CERTIFICATE" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              if [ -n "${!v}" ]; then
                echo "::add-mask::${!v}"
                { echo "$v<<EOF_$v"; echo "${!v}"; echo "EOF_$v"; } >> "$GITHUB_ENV"
              fi
            done
          else
            echo "No signing certificate: ad-hoc signing"
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: cargo tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: Dictation ${{ github.ref_name }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
      - name: Show macOS signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP=$(find target -path '*/bundle/macos/*.app' -maxdepth 6 -type d | head -1)
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E 'Identifier|Authority|Signature|flags|TeamIdentifier' || true
          codesign -d --entitlements - "$APP" 2>&1 | grep -A1 audio-input || true
          codesign -d -r- "$APP" 2>&1 | tail -1 || true
