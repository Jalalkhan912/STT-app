name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p dictation-core
  release:
    needs: core
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            bundle: dmg
            args: --target aarch64-apple-darwin --bundles dmg
          - os: windows-latest
            bundle: nsis
            args: --bundles nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI install and build
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Short target dir (MAX_PATH in nested CMake builds)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "CARGO_TARGET_DIR=D:/t" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Vulkan SDK
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.309.0
          cache: true
      - name: Cache cargo-tauri
        id: tauri-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri*
          key: cargo-tauri-2-${{ runner.os }}
          save-always: true
      - name: Install tauri-cli
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked
      # The Tauri bundler treats any set APPLE_CERTIFICATE (even empty) as a
      # certificate to import, so only export the secrets when they exist.
      - name: macOS signing (certificate if provided, else ad-hoc)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              if [ -n "${!v}" ]; then
                echo "::add-mask::${!v}"
                { echo "$v<<EOF_$v"; echo "${!v}"; echo "EOF_$v"; } >> "$GITHUB_ENV"
              fi
            done
          else
            echo "No APPLE_CERTIFICATE: ad-hoc signing"
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: cargo tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: Dictation ${{ github.ref_name }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
