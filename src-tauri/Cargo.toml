[package]
name = "dictation-app"
version = "0.1.0"
edition = "2021"
description = "Offline push-to-talk dictation"

[lib]
name = "dictation_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
dictation-core = { path = "../crates/core" }
tauri = { version = "2.12", features = ["tray-icon", "macos-private-api", "protocol-asset"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
cpal = "0.15"
rubato = "0.16"
arboard = { version = "3", default-features = false }
enigo = "0.6"
# Vendored fork of rdev (rustdesk-org, rev 0904f23): its macOS listener builds key names safely
# (upstream 0.5 crashes on recent macOS) and we re-enable the event tap when macOS disables it.
rdev = { path = "../third_party/rdev" }

[target.'cfg(target_os = "macos")'.dependencies]
dictation-core = { path = "../crates/core", features = ["parakeet", "whisper-metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
dictation-core = { path = "../crates/core", features = ["parakeet", "whisper-vulkan"] }

[target.'cfg(target_os = "macos")'.dependencies.tauri-nspanel]
git = "https://github.com/ahkohd/tauri-nspanel"
rev = "3ffa93ed14e0f8e857e43619b4157f2a685d35a4"

[target.'cfg(target_os = "macos")'.dependencies.core-foundation]
version = "0.10"

[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
version = "0.3"

[target.'cfg(target_os = "macos")'.dependencies.block2]
version = "0.6"

[target.'cfg(target_os = "macos")'.dependencies.objc2]
version = "0.6"

[target.'cfg(target_os = "macos")'.dependencies.objc2-av-foundation]
version = "0.3"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
]
